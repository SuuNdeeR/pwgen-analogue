name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format gcc make

    - name: Build Application
      run: make

    - name: Check Code Style
      run: make check-style

    - name: Run Unit Tests
      run: make test

    - name: Run Code Coverage (Only gcov)
      run: make coverage

    # ЕДИНСТВЕННЫЙ шаг для сохранения артефактов
    - name: Upload Raw gcov Reports
      uses: actions/upload-artifact@v4.3.3
      with:
        name: gcov-report-files
        path: "**/*.gcov"
        if-no-files-found: ignore